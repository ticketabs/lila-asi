[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lila-asi"
version = "2.4.0"
description = "Lila ASI v2.4 Standalone C11 + Python Inference Runtime (Universal 8-Quant, Sieve lm_head, E05 Sparse Grammar, E06 State Tree)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
authors = [{name = "TicketLabs (Harboria Labs)"}]
dependencies = []

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
lila_asi = ["*.so"]
